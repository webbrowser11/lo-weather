<!-- Fetch last updated time -->
<script>
fetch('https://lo-weather.vercel.app/api/last-updated')
    .then(response => response.json())
    .then(data => {
        document.getElementById('last-updated').textContent =
            data['last-updated-lake-oswego'];
    })
    .catch(error => {
        console.error(error);
        document.getElementById('last-updated').textContent =
            'could not fetch last updated time.';
    });
</script>
