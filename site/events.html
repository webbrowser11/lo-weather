<!-- Fetch special events -->
<script>
fetch('https://lo-weather.vercel.app/api/events')
    .then(response => response.json())
    .then(data => {
        document.getElementById('events').innerHTML =
            data['events-lake-oswego'].replace(/\n/g, "<br>");
    })
    .catch(error => {
        console.error(error);
        document.getElementById('events').textContent =
            'could not fetch special events.';
    });
</script>

<span id="events"></span>
