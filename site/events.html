<title>Special Weather Events</title>
<h1>Special Weather Events</h1>

<div style="position: fixed; top: 0; right: 0; text-decoration: none;">
  <a href="javascript:history.back()"><- Back</a>
</div>

<!-- Fetch special events -->
<script>
fetch('https://lo-weather.vercel.app/api/events')
    .then(response => response.json())
    .then(data => {
        document.getElementById('events').innerHTML =
            data['events-lake-oswego'].replace(/\n/g, "<br>");
    })
    .catch(error => {
        console.error(error);
        document.getElementById('events').textContent =
            'could not fetch special events.';
    });
</script>

<span id="events"></span>
