<title>Current Weather Observations</title>
<h1>Current Weather Observations</h1>

<div style="position: fixed; top: 10px; right: 10px; color: blue; text-decoration: none;">
  <a href="javascript:history.back()" style="color: blue; text-decoration: none;"><- Back</a>
</div>

<script>
fetch('https://lo-weather.vercel.app/api/observations')
    .then(response => response.json())
    .then(data => {
        document.getElementById("observations").innerHTML =
            data["current"];

        document.getElementById("last-updated").innerHTML =
            "Last updated: " + data["last_updated"];
    })
    .catch(error => {
        console.error(error);

        document.getElementById("observations").textContent =
            "could not fetch weather observations.";

        document.getElementById("last-updated").textContent =
            "could not fetch last updated time.";
    });
</script>

<p>
    <span id="observations">loading...</span>
</p>

<p>
    <span id="last-updated">loading...</span>
</p>
